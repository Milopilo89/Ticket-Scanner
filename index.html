
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Ticket-Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 18px;
      background: #f5f6f8;
      color: #111827;
    }
    h1 { text-align: center; }
    button {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
    }
    button:disabled { opacity: .5; }
    .secondary { background: #374151; }
    .danger { background: #b91c1c; }
    .panel {
      background: white;
      padding: 16px;
      border-radius: 16px;
      margin: 14px 0;
    }
    #result {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }
    .ok { color: #15803d; }
    .bad { color: #b91c1c; }
    label { display: flex; gap: 10px; align-items: center; }
    label input { width: 22px; height: 22px; }
    li { padding: 7px 0; overflow-wrap: anywhere; }
    small { color: #6b7280; }
  </style>
</head>
<body>
  <h1>🎟️ Ticket-Scanner</h1>

  <div class="panel">
    <label>
      <input type="checkbox" id="multiple">
      <span><b>Mehrfach scannen erlauben</b></span>
    </label>
    <small>Erlaubt mehrere gespeicherte Einträge desselben Codes.</small>
  </div>

  <button id="start">📷 Kamera starten</button>
  <div id="reader"></div>
  <button id="stop" class="secondary" hidden>Kamera stoppen</button>

  <div class="panel">
    <div id="result">Noch kein Barcode gescannt</div>
    <p id="code"></p>
    <button id="save" hidden>Barcode speichern</button>
  </div>

  <div class="panel">
    <h3>Gespeicherte Scans: <span id="count">0</span></h3>
    <button id="show" class="secondary">Gespeicherte Codes anzeigen</button>
    <ul id="list" hidden></ul>
    <button id="export" class="secondary">Daten sichern (JSON)</button>
  </div>

  <script>
    const KEY = "ticketScannerDataV1";
    let records = load();
    let scanner = null;
    let currentCode = null;
    let busy = false;

    const $ = id => document.getElementById(id);

    function load() {
      try {
        const value = JSON.parse(localStorage.getItem(KEY) || "[]");
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    function persist() {
      try {
        localStorage.setItem(KEY, JSON.stringify(records));
        updateCount();
        return true;
      } catch {
        alert("Speichern fehlgeschlagen. Der Speicher könnte voll sein.");
        return false;
      }
    }

    function updateCount() {
      $("count").textContent = records.length;
    }

    function showResult(text, good) {
      $("result").textContent = text;
      $("result").className = good ? "ok" : "bad";
    }

    function scanSuccess(decodedText) {
      if (busy) return;
      busy = true;
      currentCode = decodedText;
      $("code").textContent = "Barcode: " + decodedText;

      const exists = records.some(r => r.code === decodedText);

      if (exists && !$("multiple").checked) {
        showResult("✓ GÜLTIG – bereits gespeichert", true);
        $("save").hidden = true;
      } else if (exists) {
        showResult("✓ BEREITS BEKANNT – erneut speicherbar", true);
        $("save").hidden = false;
      } else {
        showResult("NEUER CODE – noch nicht gespeichert", false);
        $("save").hidden = false;
      }

      // Kurze Pause, damit derselbe Barcode nicht
      // unmittelbar mehrfach von der Kamera erfasst wird.
      setTimeout(() => { busy = false; }, 1800);
    }

    $("start").onclick = async () => {
      if (!window.isSecureContext || !navigator.mediaDevices) {
        alert("Bitte die App über eine HTTPS-Adresse in Safari öffnen.");
        return;
      }

      try {
        $("start").disabled = true;
        scanner = new Html5Qrcode("reader");
        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 260, height: 160 } },
          scanSuccess,
          () => {}
        );
        $("stop").hidden = false;
      } catch (e) {
        alert("Kamera konnte nicht gestartet werden. Bitte Kamerazugriff erlauben und erneut versuchen.");
        scanner = null;
      } finally {
        $("start").disabled = false;
      }
    };

    $("stop").onclick = async () => {
      if (scanner) {
        try { await scanner.stop(); } catch {}
        try { scanner.clear(); } catch {}
        scanner = null;
      }
      $("reader").innerHTML = "";
      $("stop").hidden = true;
    };

    $("save").onclick = () => {
      if (currentCode === null) return;

      const exists = records.some(r => r.code === currentCode);

      if (exists && !$("multiple").checked) {
        showResult("Bereits gespeichert – kein Duplikat angelegt", true);
        $("save").hidden = true;
        return;
      }

      records.push({
        code: currentCode,
        scannedAt: new Date().toISOString()
      });

      if (persist()) {
        showResult("✓ GESPEICHERT", true);
        $("save").hidden = true;
        renderList();
      } else {
        records.pop();
      }
    };

    function renderList() {
      const list = $("list");
      list.replaceChildren();

      records.slice().reverse().forEach((record, index) => {
        const li = document.createElement("li");
        li.textContent = record.code + " — " +
          new Date(record.scannedAt).toLocaleString("de-DE");
        list.appendChild(li);
      });

      updateCount();
    }

    $("show").onclick = () => {
      $("list").hidden = !$("list").hidden;
      if (!$("list").hidden) renderList();
    };

    $("export").onclick = () => {
      const blob = new Blob(
        [JSON.stringify(records, null, 2)],
        { type: "application/json" }
      );
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "ticket-scans.json";
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    updateCount();
  </script>
</body>
</html>
