
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Tickets Mila´s Geburtstag</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, sans-serif;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px 16px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      background: #000;
      color: #fff;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 28px;
    }

    h1 { font-size: 24px; margin: 0; }
    h2, h3 { margin-top: 0; }

    button {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { opacity: .5; }
    .secondary { background: #303030; }

    #menuButton {
      width: 52px;
      min-width: 52px;
      margin: 0;
      padding: 12px;
      font-size: 24px;
      background: #242424;
    }

    .panel {
      background: #151515;
      padding: 16px;
      border: 1px solid #303030;
      border-radius: 16px;
      margin: 16px 0;
    }

    label {
      display: flex;
      align-items: center;
      gap: 12px;
      line-height: 1.4;
    }

    label input {
      width: 22px;
      height: 22px;
      accent-color: #2563eb;
      flex-shrink: 0;
    }

    small { color: #aaa; }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      margin-top: 16px;
    }

    #reader video { border-radius: 12px; }

    #code {
      overflow-wrap: anywhere;
      color: #ccc;
    }

    #result {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    #save[hidden], #stop[hidden], #menu[hidden],
    #list[hidden], #resultFlash[hidden] {
      display: none !important;
    }

    li {
      padding: 10px 0;
      border-bottom: 1px solid #333;
      overflow-wrap: anywhere;
    }

    #resultFlash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: white;
      font-size: clamp(48px, 13vw, 76px);
      font-weight: 900;
      letter-spacing: 1px;
      overflow-wrap: anywhere;
    }

    #resultFlash.valid { background: #00a83b; }
    #resultFlash.invalid { background: #e00000; }
    #resultFlash span { max-width: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>🎟️ Tickets Mila´s Geburtstag</h1>
    <button id="menuButton" aria-label="Menü öffnen"
      aria-expanded="false">☰</button>
  </header>

  <div id="menu" class="panel" hidden>
    <h2>Menü</h2>

    <label>
      <input type="checkbox" id="multiple">
      <span><b>Mehrfach scannen erlauben</b></span>
    </label>
    <small>
      Aktiviert: Derselbe Barcode darf mehrfach gespeichert werden.
    </small>

    <hr style="border-color:#333; margin:18px 0">

    <h3>Gespeicherte Scans: <span id="count">0</span></h3>
    <button id="show" class="secondary">
      Gespeicherte Codes anzeigen
    </button>
    <ul id="list" hidden></ul>

    <button id="export" class="secondary">
      Daten sichern (JSON)
    </button>
  </div>

  <button id="start">▦ Scannen</button>
  <div id="reader"></div>
  <button id="stop" class="secondary" hidden>
    Kamera stoppen
  </button>

  <div class="panel">
    <div id="result">Bereit zum Scannen</div>
    <p id="code"></p>
    <button id="save" hidden>Barcode speichern</button>
  </div>

  <div id="resultFlash" hidden role="status" aria-live="assertive">
    <span id="flashText"></span>
  </div>

  <script>
    // Bestehende lokale Daten bleiben erhalten.
    const KEY = "ticketScannerDataV1";

    let records = load();
    let scanner = null;
    let currentCode = null;
    let busy = false;
    let flashTimer = null;
    let lastScanCode = null;
    let audioContext = null;

    const $ = id => document.getElementById(id);

    function load() {
      try {
        const value = JSON.parse(localStorage.getItem(KEY) || "[]");
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    function persist() {
      try {
        localStorage.setItem(KEY, JSON.stringify(records));
        updateCount();
        return true;
      } catch {
        alert("Speichern fehlgeschlagen. Bitte Daten sichern und Speicher prüfen.");
        return false;
      }
    }

    function updateCount() {
      $("count").textContent = records.length;
    }

    function showResult(text) {
      $("result").textContent = text;
    }

    // Drei unterschiedliche Töne direkt erzeugen.
    function playBeep(type) {
      try {
        const AudioCtx =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioCtx) return;

        if (!audioContext) audioContext = new AudioCtx();

        if (audioContext.state === "suspended") {
          audioContext.resume().catch(() => {});
        }

        const ctx = audioContext;
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        const now = ctx.currentTime;

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        if (type === "valid") {
          // Heller, freundlicher Bestätigungston.
          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(880, now);
          oscillator.frequency.setValueAtTime(1175, now + 0.12);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
          gain.gain.setValueAtTime(0.2, now + 0.18);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

          oscillator.start(now);
          oscillator.stop(now + 0.36);
        } else if (type === "invalid") {
          // Tieferer Warnton.
          oscillator.type = "square";
          oscillator.frequency.setValueAtTime(220, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
          gain.gain.setValueAtTime(0.18, now + 0.22);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

          oscillator.start(now);
          oscillator.stop(now + 0.39);
        } else {
          // Kurzer Scanner-Piep.
          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(1450, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(0.2, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

          oscillator.start(now);
          oscillator.stop(now + 0.13);
        }
      } catch (e) {
        // Scannen funktioniert auch, wenn kein Ton verfügbar ist.
      }
    }

    function flash(text, isValid, duration = 1300) {
      clearTimeout(flashTimer);

      $("resultFlash").className = isValid ? "valid" : "invalid";
      $("flashText").textContent = text;
      $("resultFlash").hidden = false;

      flashTimer = setTimeout(() => {
        $("resultFlash").hidden = true;
      }, duration);
    }

    function scanSuccess(decodedText) {
      if (busy) return;

      busy = true;
      lastScanCode = decodedText;
      currentCode = decodedText;

      // Jeder erkannte Code erhält einen kurzen Scan-Piep.
      playBeep("scan");

      const exists = records.some(r => r.code === decodedText);

      $("code").textContent = "Barcode: " + decodedText;

      if (exists) {
        showResult("Code in deiner Liste gefunden");
        playBeep("valid");
        flash("GÜLTIG", true);

        $("save").hidden = !$("multiple").checked;
      } else {
        showResult("Code nicht in deiner Liste");
        playBeep("invalid");
        flash("UNGÜLTIG", false);

        // Unbekannte Codes können manuell gespeichert werden.
        $("save").hidden = false;
      }

      // Verhindert schnelle Wiederholungen derselben Aufnahme.
      setTimeout(() => { busy = false; }, 1800);
    }

    $("menuButton").onclick = () => {
      const open = $("menu").hidden;
      $("menu").hidden = !open;
      $("menuButton").setAttribute("aria-expanded", String(open));
    };

    $("start").onclick = async () => {
      if (!window.isSecureContext || !navigator.mediaDevices) {
        alert("Bitte die App über HTTPS in Safari öffnen.");
        return;
      }

      if (typeof Html5Qrcode === "undefined") {
        alert("Der Scanner konnte nicht geladen werden. Bitte Internetverbindung prüfen.");
        return;
      }

      if (scanner) {
        try { await scanner.stop(); } catch {}
        try { scanner.clear(); } catch {}
        scanner = null;
      }

      try {
        $("start").disabled = true;
        $("code").textContent = "";
        currentCode = null;
        $("save").hidden = true;

        showResult("Kamera wird gestartet …");

        // Audio-Kontext möglichst durch die Nutzeraktion aktivieren.
        try {
          const AudioCtx =
            window.AudioContext || window.webkitAudioContext;

          if (AudioCtx && !audioContext) {
            audioContext = new AudioCtx();
          }

          if (audioContext && audioContext.state === "suspended") {
            await audioContext.resume();
          }
        } catch {}

        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 260, height: 160 } },
          scanSuccess,
          () => {}
        );

        $("stop").hidden = false;
        showResult("Bitte Barcode vor die Kamera halten");
      } catch (e) {
        scanner = null;
        showResult("Kamera konnte nicht gestartet werden");
        alert("Bitte Kamerazugriff erlauben und erneut versuchen.");
      } finally {
        $("start").disabled = false;
      }
    };

    $("stop").onclick = async () => {
      if (scanner) {
        try { await scanner.stop(); } catch {}
        try { scanner.clear(); } catch {}
        scanner = null;
      }

      $("reader").innerHTML = "";
      $("stop").hidden = true;
      busy = false;
      showResult("Kamera gestoppt");
    };

    $("save").onclick = () => {
      if (currentCode === null) return;

      const exists = records.some(r => r.code === currentCode);

      if (exists && !$("multiple").checked) {
        showResult("Bereits gespeichert – kein Duplikat angelegt");
        $("save").hidden = true;
        playBeep("valid");
        flash("GÜLTIG", true);
        return;
      }

      records.push({
        code: currentCode,
        scannedAt: new Date().toISOString()
      });

      if (persist()) {
        showResult("Code gespeichert");
        $("save").hidden = true;
        renderList();
        playBeep("valid");
        flash("GÜLTIG", true);
      } else {
        records.pop();
      }
    };

    function renderList() {
      const list = $("list");
      list.replaceChildren();

      records.slice().reverse().forEach(record => {
        const li = document.createElement("li");

        const date = record.scannedAt
          ? new Date(record.scannedAt).toLocaleString("de-DE")
          : "Datum unbekannt";

        li.textContent = record.code + " — " + date;
        list.appendChild(li);
      });

      updateCount();
    }

    $("show").onclick = () => {
      $("list").hidden = !$("list").hidden;

      $("show").textContent = $("list").hidden
        ? "Gespeicherte Codes anzeigen"
        : "Gespeicherte Codes verbergen";

      if (!$("list").hidden) renderList();
    };

    $("export").onclick = () => {
      const blob = new Blob(
        [JSON.stringify(records, null, 2)],
        { type: "application/json" }
      );

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = "tickets-milas-geburtstag.json";
      a.click();

      setTimeout(() => URL.revokeObjectURL(url), 1500);
    };

    updateCount();
  </script>
</body>
</html>
